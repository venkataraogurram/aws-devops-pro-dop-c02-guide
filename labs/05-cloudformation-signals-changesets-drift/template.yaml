AWSTemplateFormatVersion: "2010-09-09"
Description: DOP-C02 Lab 05 - cfn-init, cfn-signal + CreationPolicy, cfn-hup, change sets, stack policy, drift, DeletionPolicy

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  PackageName:
    Type: String
    Default: httpd
    Description: Package cfn-init installs. Set a wrong name to make cfn-init fail.
  Message:
    Type: String
    Default: Version 1
    Description: Text in index.html. Changing it updates only metadata (cfn-hup applies it).
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Pinned AMI ID (see README step 0). A fixed ID stops a newly published AMI from replacing the instance during updates.

Resources:
  RetainedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # survives stack deletion
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lab 05 web server - no inbound rules (we add one by hand to create drift)
      VpcId: !Ref VpcId

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebServer:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default: [install, configure]     # configs run in this order
        install:
          commands:
            00_install_package:
              command: !Sub dnf install -y ${PackageName}   # non-zero exit = cfn-init fails = cfn-signal sends failure
        configure:
          files:
            /var/www/html/index.html:
              content: !Sub "<html><body><h1>DOP Lab 05 - ${Message}</h1></body></html>\n"
              mode: "000644"
              owner: root
              group: root
            /etc/cfn/cfn-hup.conf:
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1
              mode: "000400"
              owner: root
              group: root
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              content: |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.WebServer.Metadata.AWS::CloudFormation::Init
                action=/usr/local/bin/rerun-cfn-init.sh
                runas=root
              mode: "000400"
              owner: root
              group: root
            /usr/local/bin/rerun-cfn-init.sh:
              content: !Sub |
                #!/bin/bash
                CFN_INIT=$(command -v cfn-init || echo /opt/aws/bin/cfn-init)
                $CFN_INIT -v --stack ${AWS::StackName} --resource WebServer --configsets default --region ${AWS::Region}
              mode: "000755"
              owner: root
              group: root
          commands:
            01_start_httpd:
              command: systemctl enable --now httpd
            02_cfn_hup_service:
              command: |
                CFN_HUP=$(command -v cfn-hup || echo /opt/aws/bin/cfn-hup)
                printf '[Unit]\nDescription=cfn-hup daemon\n[Service]\nExecStart=%s\nRestart=always\n[Install]\nWantedBy=multi-user.target\n' "$CFN_HUP" > /etc/systemd/system/cfn-hup.service
                systemctl daemon-reload
                systemctl enable cfn-hup
                systemctl restart cfn-hup
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSG]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required }
      Tags:
        - { Key: Name, Value: dop-lab05-web }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          dnf install -y aws-cfn-bootstrap
          CFN_BIN=$(dirname "$(command -v cfn-init || echo /opt/aws/bin/cfn-init)")
          $CFN_BIN/cfn-init -v --stack ${AWS::StackName} --resource WebServer --configsets default --region ${AWS::Region}
          $CFN_BIN/cfn-signal -e $? --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}

Outputs:
  InstanceId:
    Value: !Ref WebServer
  SecurityGroupId:
    Value: !Ref WebSG
  RetainedBucketName:
    Value: !Ref RetainedBucket
